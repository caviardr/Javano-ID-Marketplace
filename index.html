<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075b34">
  <title>Javano ID Marketplace</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="topbar">
  <button class="brand" onclick="go('home')" aria-label="Home">
    <img src="./assets/icon-192.png" alt="Javano ID">
    <span class="brand-copy"><strong>Javano ID</strong><small>Marketplace Herbal</small></span>
  </button>
  <div class="top-search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" placeholder="Cari produk, merek, atau kategori..." oninput="window.marketSearch&&marketSearch(this.value)">
  </div>
  <div class="top-actions">
    <button class="round-action" onclick="go('support')" aria-label="CS"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg></button>
    <button class="round-action cart-badge" onclick="go('cart')" aria-label="Keranjang"><svg viewBox="0 0 24 24"><path d="M3 3h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 7H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span id="cartCount">0</span></button>
  </div>
</header>

  <main id="app"></main>

  <nav id="bottomNav" class="bottom-nav">
  <button data-page="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><small>Home</small></button>
  <button data-page="catalog" onclick="go('catalog')"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><small>Produk</small></button>
  <button data-page="network" onclick="go('network')"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 7.5v4M12 11.5 6.5 15M12 11.5 17.5 15"/></svg><small>Jaringan</small></button>
  <button data-page="orders" onclick="go('orders')"><svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="m4 7 8 4 8-4v10l-8 4-8-4V7Z"/><path d="M12 11v10"/></svg><small>Pesanan</small></button>
  <button data-page="account" onclick="go('account')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><small>Akun</small></button>
</nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
