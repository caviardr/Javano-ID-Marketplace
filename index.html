<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a20f16">
  <title>Javano ID Marketplace</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="topbar">
    <button class="brand" onclick="go('home')" aria-label="Home">
      <img src="./assets/icon-192.png" alt="Javano ID">
      <span class="brand-copy"><strong>Javano ID</strong><small>Marketplace Herbal</small></span>
    </button>
    <div class="top-actions">
      <button class="round-action" onclick="go('support')" aria-label="CS Admin">💬</button>
      <button class="round-action cart-badge" onclick="go('cart')" aria-label="Keranjang">🛒<span id="cartCount">0</span></button>
    </div>
  </header>

  <main id="app"></main>

  <nav id="bottomNav" class="bottom-nav">
    <button data-page="home" onclick="go('home')"><span>⌂</span><small>Home</small></button>
    <button data-page="catalog" onclick="go('catalog')"><span>▣</span><small>Produk</small></button>
    <button data-page="network" onclick="go('network')"><span>♧</span><small>Jaringan</small></button>
    <button data-page="orders" onclick="go('orders')"><span>◇</span><small>Pesanan</small></button>
    <button data-page="account" onclick="go('account')"><span>●</span><small>Akun</small></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
